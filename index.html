<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Grade Calculator</title>

    <!-- Bootstrap first -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- Your CSS after, so it can override Bootstrap -->
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container my-4">
      <h1 class="text-primary">Student Grade Calculator</h1>

      <div class="input-group my-4">
        <span class="input-group-text">Student Name</span>
        <input type="text" id="studentName" class="form-control" />
      </div>

      <div class="input-group my-4">
        <span class="input-group-text">Mark</span>
        <input type="number" id="mark" class="form-control" min="0" max="100" />
      </div>

      <div id="result" class="result-box"></div>

      <button id="calcBtn" class="btn btn-primary mt-3">Calculate Grade</button>

      <h2 class="mt-5">Exercise</h2>
      <p>1: Add a second subject.</p>
      <p>2: Calculate the average of three subjects.</p>
      <p>3: Display the list of students and their grades.</p>
    </div>

    <!-- JS last, so the elements already exist -->
    <script src="script.js"></script>
  </body>
</html>
